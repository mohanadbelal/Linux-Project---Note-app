<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A sleek note-taking application to capture and organize your thoughts." />
  <title>{% block title %}NoteVault{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #161625;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #6c63ff;
      --accent-glow: rgba(108, 99, 255, 0.35);
      --accent-secondary: #00d2ff;
      --text-primary: #e8e8f0;
      --text-secondary: #8a8a9a;
      --text-muted: #55556a;
      --success: #2ecc71;
      --error: #e74c3c;
      --info: #3498db;
      --warning: #f39c12;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }
    /* Animated gradient mesh background */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(108, 99, 255, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 60% at 80% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 80% at 50% 90%, rgba(108, 99, 255, 0.06) 0%, transparent 70%);
      animation: meshShift 20s ease-in-out infinite alternate;
    }
    @keyframes meshShift {
      0%   { opacity: 1; }
      50%  { opacity: 0.7; }
      100% { opacity: 1; }
    }
    a { color: inherit; text-decoration: none; }

    /* ===== NAVBAR ===== */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(15, 15, 26, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 100;
    }
    .navbar-brand {
      font-size: 1.4rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .navbar-brand span { font-weight: 300; opacity: .7; }
    .navbar-actions { display: flex; gap: .75rem; align-items: center; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .6rem 1.3rem; border-radius: var(--radius-sm);
      font-family: inherit; font-size: .875rem; font-weight: 500;
      border: none; cursor: pointer;
      transition: var(--transition);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }
    .btn-ghost {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--glass-border);
    }
    .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .btn-danger {
      background: rgba(231, 76, 60, 0.15);
      color: var(--error);
      border: 1px solid rgba(231, 76, 60, 0.2);
    }
    .btn-danger:hover { background: rgba(231, 76, 60, 0.25); }
    .btn-sm { padding: .4rem .9rem; font-size: .8rem; }
    .btn-icon {
      width: 36px; height: 36px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }

    /* ===== FLASH MESSAGES ===== */
    .flash-container { padding: 1rem 2rem 0; }
    .flash {
      padding: .85rem 1.2rem; border-radius: var(--radius-sm);
      font-size: .875rem; animation: slideDown .3s ease;
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: .5rem;
    }
    .flash-success { background: rgba(46, 204, 113, 0.12); color: var(--success); border: 1px solid rgba(46, 204, 113, 0.2); }
    .flash-error   { background: rgba(231, 76, 60, 0.12); color: var(--error); border: 1px solid rgba(231, 76, 60, 0.2); }
    .flash-info    { background: rgba(52, 152, 219, 0.12); color: var(--info); border: 1px solid rgba(52, 152, 219, 0.2); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== CONTAINER ===== */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    /* ===== SEARCH BAR ===== */
    .search-bar {
      display: flex; gap: .75rem; margin-bottom: 2rem; flex-wrap: wrap;
    }
    .search-input {
      flex: 1; min-width: 220px;
      padding: .7rem 1.2rem;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit; font-size: .9rem;
      transition: var(--transition);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .category-pills { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .pill {
      padding: .35rem .9rem; border-radius: 20px;
      font-size: .78rem; font-weight: 500;
      background: var(--bg-card); color: var(--text-secondary);
      border: 1px solid var(--glass-border);
      cursor: pointer; transition: var(--transition);
    }
    .pill:hover, .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ===== NOTE CARDS GRID ===== */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .note-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      transition: var(--transition);
      display: flex; flex-direction: column;
      animation: fadeUp .4s ease both;
      position: relative; overflow: hidden;
    }
    .note-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-secondary));
      opacity: 0; transition: var(--transition);
    }
    .note-card:hover {
      transform: translateY(-4px);
      border-color: rgba(108, 99, 255, 0.25);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .note-card:hover::before { opacity: 1; }
    .note-card.pinned { border-color: rgba(108, 99, 255, 0.3); }
    .note-card.pinned::before { opacity: 1; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .note-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .75rem; }
    .note-title { font-size: 1.1rem; font-weight: 600; line-height: 1.3; flex: 1; }
    .pin-badge {
      font-size: .7rem; padding: .2rem .5rem; border-radius: 6px;
      background: rgba(108, 99, 255, 0.15); color: var(--accent);
      font-weight: 600; margin-left: .5rem; white-space: nowrap;
    }
    .note-category {
      display: inline-block; font-size: .72rem; font-weight: 500;
      color: var(--accent-secondary); margin-bottom: .75rem;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .note-content {
      color: var(--text-secondary); font-size: .875rem;
      line-height: 1.65; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 4;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 1rem;
    }
    .note-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: .75rem;
      border-top: 1px solid var(--glass-border);
    }
    .note-date { font-size: .75rem; color: var(--text-muted); }
    .note-actions { display: flex; gap: .4rem; }

    /* ===== FORM PAGE ===== */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 2rem;
      backdrop-filter: blur(12px);
      max-width: 700px; margin: 0 auto;
    }
    .form-card h2 {
      font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block; font-size: .82rem; font-weight: 500;
      color: var(--text-secondary); margin-bottom: .4rem;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .form-control {
      width: 100%; padding: .75rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit; font-size: .9rem;
      transition: var(--transition);
    }
    .form-control:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    textarea.form-control { min-height: 200px; resize: vertical; line-height: 1.7; }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.5rem; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .5; }
    .empty-state h3 { font-size: 1.2rem; font-weight: 500; margin-bottom: .5rem; color: var(--text-secondary); }
    .empty-state p { font-size: .9rem; margin-bottom: 1.5rem; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .navbar { padding: .75rem 1rem; }
      .container { padding: 1.25rem; }
      .notes-grid { grid-template-columns: 1fr; }
      .form-card { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="navbar-brand">NoteVault<span> · notes</span></a>
    <div class="navbar-actions">
      <a href="{{ url_for('create_note') }}" class="btn btn-primary btn-sm">✚ New Note</a>
    </div>
  </nav>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-container">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <!-- Page content -->
  {% block content %}{% endblock %}

  <script>
    // Auto-dismiss flash messages after 4 seconds
    document.querySelectorAll('.flash').forEach(el => {
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(-10px)'; setTimeout(() => el.remove(), 300); }, 4000);
    });
  </script>
</body>
</html>
